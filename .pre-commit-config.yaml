repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.0
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format

exclude: |
  (?x)^(
  ciq-cherry-pick.py |
  ciq_helpers.py |
  jira_pr_check.py |
  release_config.py |
  rolling-release-update.py |
  run_interdiff.py |
  )$
